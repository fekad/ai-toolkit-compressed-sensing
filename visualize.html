            <style>
                #jsmol {
                    position:absolute;
                    top:30px;
                    left:800px;
                    /* left:750px; */
                    text-align:center;
                    font-family: Arial, Helvetica, sans-serif;
                    font-weight: normal;
                }

                .button {
                    cursor:pointer;
                    margin:12px;
                    width: 80px;
                    /* margin-left: 100px; */
                    background-color:#28AE7F;
                    border:none;
                    display:inline-block;
                    border-radius:4px;
                    color:white;
                    padding:20px 0;
                    text-align:center;
                    text-decoration:none;
                }

                #analyze {
                    margin-left: 20%;
                }

                .button:hover {
                    background-color: #2A768E;
                    color:white;
                    -o-transition:.2s;
                    -ms-transition:.2s;
                    -moz-transition:.2s;
                    -webkit-transition:.2s;
                  /* ...and now for the proper property */
                    transition:.2s;
                }

                #appdiv {
                    width:450px;
                    /* width:500px; */
                    height:450px
                }

                #molecule_text {
                    margin:5px;
                    margin-right:20px;
                    margin-bottom:0;
                    padding:4px 0;
                    color:white;
                    background-color:gray;
                    border-radius:4px;
                }

                #radio_group {
                    margin-top: 5px;
                    position: relative;
                }

                #jmolRadioGroup0 input {
                    position: relative;
                    opacity: 0.5;
                    cursor: pointer;
                }

                #jsmol_hold {
                    position:absolute;
                    top:316px;
                    left:550px;
                    text-align:center;
                    font-family: Arial, Helvetica, sans-serif;
